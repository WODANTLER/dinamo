   DÍNAMO — Análisis de velocidad de movimiento (VBT)
   Prototipo: subida al cajón con sticker de referencia.
   ============================================================ */

const G = 9.81; // gravedad m/s2

/* ---------- Persistencia (localStorage) ---------- */

/* ---------- Visión: detección del sticker blanco ---------- */
function detectBlob(data, W, H, cx, cy, radius, threshold, satMax) {
  let minX = W, minY = H, maxX = 0, maxY = 0, count = 0;
  const x0 = Math.max(0, (cx - radius) | 0), x1 = Math.min(W, (cx + radius) | 0);
  const y0 = Math.max(0, (cy - radius) | 0), y1 = Math.min(H, (cy + radius) | 0);
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
      if (mn >= threshold && (mx - mn) <= satMax) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        count++;
      }
    }
  }
  if (count < 10) return null;
  return {
    minX, minY, maxX, maxY, count,
    cx: (minX + maxX) / 2, cy: (minY + maxY) / 2,
    w: maxX - minX + 1, h: maxY - minY + 1,
  };
}

function trackCentroid(data, W, H, px, py, radius, threshold, satMax) {
  let sx = 0, sy = 0, sw = 0, count = 0;
  const x0 = Math.max(0, (px - radius) | 0), x1 = Math.min(W, (px + radius) | 0);
  const y0 = Math.max(0, (py - radius) | 0), y1 = Math.min(H, (py + radius) | 0);
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
      if (mn >= threshold && (mx - mn) <= satMax) {
        const w = mn;
        sx += x * w; sy += y * w; sw += w; count++;
      }
    }
  }
  if (count < 6) return null;
  return { x: sx / sw, y: sy / sw, count };
}

/* ---------- Cinemática ---------- */
function movingAvg(arr, win) {
  const half = Math.floor(win / 2), out = [];
  for (let i = 0; i < arr.length; i++) {
    let s = 0, n = 0;
    for (let j = i - half; j <= i + half; j++) {
      if (j >= 0 && j < arr.length) { s += arr[j]; n++; }
    }
    out.push(s / n);
  }
  return out;
}

function computeMetrics(track, pxPerCm, bodyWeightKg) {
  const t = track.map((p) => p.t);
  const ys = movingAvg(track.map((p) => p.y), 5);
  const yMax = Math.max.apply(null, ys);
  const heightM = ys.map((y) => (yMax - y) / pxPerCm / 100);

  const vel = heightM.map((_, i) => {
    if (i === 0 || i === heightM.length - 1) return 0;
    const dt = t[i + 1] - t[i - 1];
    return dt > 0 ? (heightM[i + 1] - heightM[i - 1]) / dt : 0;
  });
  const velS = movingAvg(vel, 5);

  const accel = velS.map((_, i) => {
    if (i === 0 || i === velS.length - 1) return 0;
    const dt = t[i + 1] - t[i - 1];
    return dt > 0 ? (velS[i + 1] - velS[i - 1]) / dt : 0;
  });
  const accelS = movingAvg(accel, 5);

  let endI = 0;
  heightM.forEach((h, i) => { if (h > heightM[endI]) endI = i; });
  let startI = 0;
  for (let i = 0; i <= endI; i++) if (heightM[i] < heightM[startI]) startI = i;
  if (startI >= endI) { startI = 0; endI = heightM.length - 1; }

  const romCm = (heightM[endI] - heightM[startI]) * 100;
  const durationS = t[endI] - t[startI];
  const meanVel = durationS > 0 ? (heightM[endI] - heightM[startI]) / durationS : 0;

  let peakVel = 0, maxAccel = 0;
  for (let i = startI; i <= endI; i++) {
    if (velS[i] > peakVel) peakVel = velS[i];
    if (Math.abs(accelS[i]) > maxAccel) maxAccel = Math.abs(accelS[i]);
  }

  let powerSum = 0, powerN = 0, peakPower = 0;
  if (bodyWeightKg > 0) {
    for (let i = startI; i <= endI; i++) {
      if (velS[i] > 0.02) {
        const p = bodyWeightKg * (G + accelS[i]) * velS[i];
        if (p > 0) { powerSum += p; powerN++; if (p > peakPower) peakPower = p; }
      }
    }
  }
  const meanPower = powerN > 0 ? powerSum / powerN : 0;

  const tracked = track.filter((p) => p.tracked).length;
  const quality = track.length ? tracked / track.length : 0;

  const t0 = t[startI];
  const series = track.map((p, i) => ({
    t: +(t[i] - t0).toFixed(3),
    height: +(heightM[i] * 100).toFixed(1),
    vel: +velS[i].toFixed(3),
    accel: +accelS[i].toFixed(2),
  }));

  return {
    meanVel, peakVel, maxAccel, romCm, durationS,
    meanPower, peakPower, quality,
    series, concentricDuration: durationS,
  };
}

/* ============================================================
   GRÁFICOS (SVG propios)
   ============================================================ */
function Sparkline({ values }) {
  if (values.length < 2) return null;
  const W = 320, H = 46, p = 5;
  const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  const x = (i) => p + (i / (values.length - 1)) * (W - 2 * p);
  const y = (v) => p + (1 - (v - min) / ((max - min) || 1)) * (H - 2 * p);
  const d = values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: H }}>
      <path d={d} fill="none" stroke="var(--accent)" strokeWidth="2" />
      {values.map((v, i) => (
        <circle key={i} cx={x(i)} cy={y(v)} r="2.6" fill="var(--accent)" />
      ))}
    </svg>
  );
}

function PerfChart({ series, concentricDuration }) {
  if (!series || series.length < 2) return null;
  const W = 340, H = 210, padL = 30, padR = 14, padT = 12, padB = 26;
  const ts = series.map((s) => s.t);
  const tMin = Math.min.apply(null, ts), tMax = Math.max.apply(null, ts);
  const vArr = series.map((s) => s.vel), hArr = series.map((s) => s.height);
  const vMax = Math.max(0.05, Math.max.apply(null, vArr));
  const vMin = Math.min(0, Math.min.apply(null, vArr));
  const hMax = Math.max(0.05, Math.max.apply(null, hArr));
  const hMin = Math.min(0, Math.min.apply(null, hArr));
  const x = (t) => padL + ((t - tMin) / ((tMax - tMin) || 1)) * (W - padL - padR);
  const yV = (v) => padT + (1 - (v - vMin) / ((vMax - vMin) || 1)) * (H - padT - padB);
  const yH = (h) => padT + (1 - (h - hMin) / ((hMax - hMin) || 1)) * (H - padT - padB);
  const velPath = series.map((s, i) => (i ? "L" : "M") + x(s.t).toFixed(1) + " " + yV(s.vel).toFixed(1)).join(" ");
  const hPath = series.map((s, i) => (i ? "L" : "M") + x(s.t).toFixed(1) + " " + yH(s.height).toFixed(1)).join(" ");
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => padT + f * (H - padT - padB));
  const zeroY = yV(0);
  return (
    <div style={{ marginTop: 4 }}>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {grid.map((gy, i) => (
          <line key={i} x1={padL} y1={gy} x2={W - padR} y2={gy}
            stroke="#2b2b32" strokeDasharray="2 4" />
        ))}
        {concentricDuration > 0 && (
          <rect x={x(0)} y={padT} width={Math.max(0, x(concentricDuration) - x(0))}
            height={H - padT - padB} fill="#c8ff00" fillOpacity="0.07" />
        )}
        <line x1={padL} y1={zeroY} x2={W - padR} y2={zeroY} stroke="#3a3a42" />
        <path d={hPath} fill="none" stroke="#82828a" strokeWidth="1.5" strokeDasharray="3 3" />
        <path d={velPath} fill="none" stroke="#c8ff00" strokeWidth="2.5"
          strokeLinejoin="round" strokeLinecap="round" />
        <text x={padL - 4} y={yV(vMax) + 3} fill="#82828a" fontSize="9"
          textAnchor="end" fontFamily="IBM Plex Mono">{vMax.toFixed(1)}</text>
        <text x={padL - 4} y={zeroY + 3} fill="#82828a" fontSize="9"
          textAnchor="end" fontFamily="IBM Plex Mono">0</text>
        <text x={padL} y={H - 8} fill="#82828a" fontSize="9"
          fontFamily="IBM Plex Mono">{tMin.toFixed(1)}s</text>
        <text x={W - padR} y={H - 8} fill="#82828a" fontSize="9"
          textAnchor="end" fontFamily="IBM Plex Mono">{tMax.toFixed(1)}s</text>
      </svg>
      <div className="hint" style={{ textAlign: "center", marginTop: 2 }}>
        <span style={{ color: "var(--accent)" }}>━ velocidad (m/s)</span> &nbsp;
        <span style={{ color: "var(--dim)" }}>┄ altura (cm)</span> &nbsp;·&nbsp;
        zona sombreada = fase de empuje
      </div>
    </div>
  );
}

/* ============================================================
   FLUJO DE ANÁLISIS
   ============================================================ */
function AnalysisScreen({ person, onBack, onSaved, previousMean }) {
  const [step, setStep] = useState(0);
  const [videoURL, setVideoURL] = useState(null);
  const [fps, setFps] = useState(60);
  const [stickerCm, setStickerCm] = useState(10);
  const [threshold, setThreshold] = useState(170);
  const satMax = 60;
  const [marker, setMarker] = useState(null);
  const [blob, setBlob] = useState(null);
  const [proc, setProc] = useState({ w: 0, h: 0 });
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const firstFrameRef = useRef(null);
  const fileInputRef = useRef(null);

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setError(null);
    setVideoURL(URL.createObjectURL(file));
  };

  const onMeta = () => {
    const v = videoRef.current;
    if (!v) return;
    const maxW = 900;
    const scale = v.videoWidth > maxW ? maxW / v.videoWidth : 1;
    setProc({ w: Math.round(v.videoWidth * scale), h: Math.round(v.videoHeight * scale) });
  };

  const seekTo = (v, tt) => new Promise((res) => {
    const h = () => { v.removeEventListener("seeked", h); res(); };
    v.addEventListener("seeked", h);
    v.currentTime = tt;
  });

  const goMark = async () => {
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !c || proc.w === 0) { setError("El video no se cargó bien."); return; }
    c.width = proc.w; c.height = proc.h;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    try {
      await seekTo(v, 0.05);
      ctx.drawImage(v, 0, 0, proc.w, proc.h);
      firstFrameRef.current = ctx.getImageData(0, 0, proc.w, proc.h);
      setMarker(null); setBlob(null);
      setStep(1);
    } catch (err) {
      console.error(err);
      setError("No se pudo leer el video. Probá con otro formato (mp4).");
    }
  };

  const redraw = useCallback((mk, th) => {
    const c = canvasRef.current, ff = firstFrameRef.current;
    if (!c || !ff) return;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.putImageData(ff, 0, 0);
    if (!mk) return;
    const d = ff.data, W = ff.width, H = ff.height, R = 90;
    const x0 = Math.max(0, mk.x - R) | 0, x1 = Math.min(W, mk.x + R) | 0;
    const y0 = Math.max(0, mk.y - R) | 0, y1 = Math.min(H, mk.y + R) | 0;
    ctx.fillStyle = "rgba(200,255,0,0.55)";
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * W + x) * 4;
        const mn = Math.min(d[i], d[i + 1], d[i + 2]);
        const mx = Math.max(d[i], d[i + 1], d[i + 2]);
        if (mn >= th && (mx - mn) <= satMax) ctx.fillRect(x, y, 1, 1);
      }
    }
    const bl = detectBlob(d, W, H, mk.x, mk.y, R, th, satMax);
    setBlob(bl);
    if (bl) {
      ctx.strokeStyle = "#ff5c38"; ctx.lineWidth = 2;
      ctx.strokeRect(bl.minX, bl.minY, bl.w, bl.h);
      ctx.fillStyle = "#ff5c38";
      ctx.beginPath(); ctx.arc(bl.cx, bl.cy, 4, 0, 7); ctx.fill();
    }
  }, []);

  useEffect(() => {
    if (step === 1 && marker) redraw(marker, threshold);
  }, [step, marker, threshold, redraw]);

  const onCanvasTap = (e) => {
    const c = canvasRef.current;
    const r = c.getBoundingClientRect();
    const x = (e.clientX - r.left) * (c.width / r.width);
    const y = (e.clientY - r.top) * (c.height / r.height);
    const ff = firstFrameRef.current;
    if (ff) {
      const bl = detectBlob(ff.data, ff.width, ff.height, x, y, 90, threshold, satMax);
      if (bl) { setMarker({ x: bl.cx, y: bl.cy }); return; }
    }
    setMarker({ x, y });
  };

  const runProcessing = async () => {
    setStep(3); setProgress(0); setError(null);
    const v = videoRef.current, c = canvasRef.current;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    const W = proc.w, H = proc.h;
    const pxPerCm = ((blob.w + blob.h) / 2) / stickerCm;
    const searchR = Math.max(45, ((blob.w + blob.h) / 2) * 2.6);
    const duration = v.duration;
    let dt = 1 / fps;
    if (duration / dt > 1200) dt = duration / 1200;
    const track = [];
    let px = marker.x, py = marker.y;

    try {
      for (let tt = 0; tt <= duration + 1e-4; tt += dt) {
        const target = Math.min(tt, duration);
        await seekTo(v, target);
        ctx.drawImage(v, 0, 0, W, H);
        const img = ctx.getImageData(0, 0, W, H).data;
        let res = trackCentroid(img, W, H, px, py, searchR, threshold, satMax);
        if (!res) res = trackCentroid(img, W, H, px, py, searchR * 2, threshold, satMax);
        const tracked = !!res;
        if (res) { px = res.x; py = res.y; }
        track.push({ t: v.currentTime, x: px, y: py, tracked });
        ctx.strokeStyle = "#c8ff00"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.stroke();
        setProgress(target / duration);
        await new Promise((r) => setTimeout(r, 0));
      }
      if (track.length < 8) { setError("El video es demasiado corto."); setStep(2); return; }
      const m = computeMetrics(track, pxPerCm, person.weight || 0);
      if (m.quality < 0.4) {
        setError("Se perdió el sticker en gran parte del video. Ajustá la sensibilidad o mejorá la luz.");
      }
      setResult(m);
      setStep(4);
    } catch (err) {
      console.error(err);
      setError("Error procesando el video.");
      setStep(2);
    }
  };

  const save = () => {
    onSaved({
      id: uid(), date: new Date().toISOString(),
      fps, stickerCm, metrics: result,
    });
  };

  const pxPerCm = blob ? ((blob.w + blob.h) / 2) / stickerCm : 0;

  return (
    <div>
      <Header onBack={onBack} title="NUEVO ANÁLISIS" />
      <div className="wrap">
        <div className="step-dots">
          {[0, 1, 2, 3].map((i) => <div key={i} className={step >= i ? "on" : ""} />)}
        </div>

        <video ref={videoRef} src={videoURL || undefined} onLoadedMetadata={onMeta}
          playsInline muted preload="auto" className="vhidden" />

        {error && (
          <div className="infobox warn" style={{ marginBottom: 12 }}>
            <Icon name="alert" size={13} style={{ verticalAlign: -2, marginRight: 4 }} />
            {error}
          </div>
        )}

        {step === 0 && (
          <div>
            <div className="seclabel">Paso 1 — Video</div>
            <div className="infobox" style={{ marginBottom: 14 }}>
              Filmá <b>de costado</b>, celular quieto y perpendicular. La persona con el
              sticker blanco de <b>{stickerCm}×{stickerCm} cm</b> en el pecho. <b>Una sola
              repetición</b> por video. Ideal grabar a 60 fps con la app de Cámara del iPhone.
            </div>
            <input ref={fileInputRef} type="file" accept="video/*"
              onChange={onFile} style={{ display: "none" }} />
            <button className="btn" onClick={() => fileInputRef.current.click()}>
              <Icon name="upload" size={16} /> {videoURL ? "Cambiar video" : "Grabar o subir video"}
            </button>
            {videoURL && (
              <div>
                <div className="row2" style={{ marginTop: 14 }}>
                  <div>
                    <label className="fld">FPS del video</label>
                    <select className="txt" value={fps} onChange={(e) => setFps(+e.target.value)}>
                      <option value={30}>30 fps</option>
                      <option value={60}>60 fps</option>
                      <option value={120}>120 fps</option>
                      <option value={240}>240 fps</option>
                    </select>
                  </div>
                  <div>
                    <label className="fld">Lado del sticker (cm)</label>
                    <input className="txt" type="number" value={stickerCm}
                      onChange={(e) => setStickerCm(+e.target.value || 10)} />
                  </div>
                </div>
                <div style={{ marginTop: 16 }}>
                  <button className="btn primary" onClick={goMark} disabled={proc.w === 0}>
                    Continuar → marcar sticker
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {step === 1 && (
          <div>
            <div className="seclabel">Paso 2 — Marcar el sticker</div>
            <div className="infobox" style={{ marginBottom: 12 }}>
              Tocá el <b>sticker blanco</b> sobre la imagen. El recuadro naranja debe
              encerrar justo el sticker, sin tomar otras zonas blancas.
            </div>
            <div className="cvwrap" onPointerDown={onCanvasTap}>
              <canvas ref={canvasRef} className="frame" />
              {!marker && (
                <div style={{
                  position: "absolute", inset: 0, display: "flex",
                  alignItems: "center", justifyContent: "center", pointerEvents: "none",
                }}>
                  <span className="pill"><Icon name="crosshair" size={12} /> Tocá el sticker</span>
                </div>
              )}
            </div>
            {marker && (
              <div>
                <label className="fld">Sensibilidad de detección</label>
                <input type="range" min={100} max={235} value={threshold}
                  onChange={(e) => setThreshold(+e.target.value)} />
                <div className="hint">
                  Menos sensible ← {threshold} → más sensible · ajustá hasta que solo
                  el sticker quede pintado de verde.
                </div>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button className="btn ghost" onClick={() => setStep(0)}>
                <Icon name="chevron-left" size={14} /> Atrás
              </button>
              <button className="btn primary" disabled={!blob} onClick={() => setStep(2)}>
                Continuar
              </button>
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <div className="seclabel">Paso 3 — Calibración</div>
            <div className="card" style={{ marginBottom: 12 }}>
              <div className="mgrid">
                <div className="metric">
                  <div className="mlabel"><Icon name="ruler" size={11} /> Sticker detectado</div>
                  <div className="mval">{blob ? Math.round((blob.w + blob.h) / 2) : "—"}
                    <span className="munit">px</span></div>
                </div>
                <div className="metric">
                  <div className="mlabel"><Icon name="target" size={11} /> Escala</div>
                  <div className="mval alt">{fmt(pxPerCm, 1)}
                    <span className="munit">px/cm</span></div>
                </div>
              </div>
            </div>
            <div className="infobox" style={{ marginBottom: 14 }}>
              Con el sticker de <b>{stickerCm} cm</b>, cada centímetro real equivale a
              <b> {fmt(pxPerCm, 1)} píxeles</b>. La app va a recorrer el video frame por
              frame ({fps} fps) midiendo el desplazamiento vertical.
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn ghost" onClick={() => setStep(1)}>
                <Icon name="chevron-left" size={14} /> Reajustar
              </button>
              <button className="btn primary" onClick={runProcessing}>
                <Icon name="play" size={15} /> Analizar
              </button>
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <div className="seclabel">Procesando</div>
            <div className="cvwrap"><canvas ref={canvasRef} className="frame" /></div>
            <div className="progress" style={{ marginTop: 12 }}>
              <div style={{ width: (progress * 100) + "%" }} />
            </div>
            <div className="hint" style={{ textAlign: "center", marginTop: 8 }}>
              <span className="spin" style={{ verticalAlign: -2, marginRight: 6 }} />
              Siguiendo el sticker… {Math.round(progress * 100)}%
            </div>
          </div>
        )}

        {step === 4 && result && (
          <div>
            <div className="seclabel">Resultado</div>
            <div className="hero">
              <div className="hlabel">Velocidad media de empuje</div>
              <div className="hval">{fmt(result.meanVel)}</div>
              <div className="hlabel">metros / segundo</div>
              {previousMean != null && (
                <div style={{ marginTop: 8 }}>
                  <span className={"delta " + (result.meanVel >= previousMean ? "up" : "down")}>
                    {result.meanVel >= previousMean ? "▲" : "▼"}{" "}
                    {fmt(result.meanVel - previousMean)} m/s vs. análisis anterior
                  </span>
                </div>
              )}
            </div>
            <div style={{ marginTop: 12 }}><MetricsGrid m={result} /></div>
            <div className="seclabel">Curva de movimiento</div>
            <PerfChart series={result.series} concentricDuration={result.concentricDuration} />
            <div style={{ margin: "10px 0" }}>
              <span className={"pill " + (result.quality > 0.85 ? "good" : "warn")}>
                <Icon name="target" size={11} /> Seguimiento {Math.round(result.quality * 100)}%
              </span>
              {result.quality <= 0.85 && (
                <span className="hint" style={{ marginLeft: 8 }}>
                  seguimiento bajo — los datos pueden ser imprecisos
                </span>
              )}
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
              <button className="btn ghost" onClick={() => { setStep(0); setResult(null); }}>
                <Icon name="rotate" size={14} /> Otro
              </button>
              <button className="btn primary" onClick={save}>
                <Icon name="check" size={15} /> Guardar análisis
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [view, setView] = useState("people");
  const [people, setPeople] = useState(() => loadPeople());
  const [analysesByPerson, setAnalysesByPerson] = useState({});
  const [selected, setSelected] = useState(null);
  const [openResult, setOpenResult] = useState(null);
  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const openPerson = (p) => {
    setSelected(p);
    setAnalysesByPerson((s) => (s[p.id] ? s : Object.assign({}, s, { [p.id]: loadAnalyses(p.id) })));
    setView("person");
  };

  const handleSavePerson = (person) => {
    const next = people.some((x) => x.id === person.id)
      ? people.map((x) => (x.id === person.id ? person : x))
      : people.concat([person]);
    setPeople(next);
    savePeople(next);
    if (selected && selected.id === person.id) setSelected(person);
    setFormOpen(false);
    setEditing(null);
  };

  const handleDeletePerson = () => {
    if (!window.confirm("¿Eliminar este perfil y todos sus análisis?")) return;
    const next = people.filter((x) => x.id !== selected.id);
    setPeople(next);
    savePeople(next);
    try { localStorage.removeItem(keyAnalyses(selected.id)); } catch (e) {}
    setView("people");
    setSelected(null);
  };

  const handleSavedAnalysis = (analysis) => {
    const list = (analysesByPerson[selected.id] || []).concat([analysis]);
    setAnalysesByPerson((s) => Object.assign({}, s, { [selected.id]: list }));
    saveAnalyses(selected.id, list);
    setView("person");
  };

  const currentAnalyses = selected ? (analysesByPerson[selected.id] || []) : [];
  const lastMean = currentAnalyses.length
    ? currentAnalyses.slice().sort((a, b) => new Date(b.date) - new Date(a.date))[0].metrics.meanVel
    : null;

  return (
    <div className="dinamo">
      <style>{CSS}</style>
      {view === "people" && (
        <PeopleScreen people={people} onOpen={openPerson}
          onAdd={() => { setEditing(null); setFormOpen(true); }} />
      )}
      {view === "person" && selected && (
        <PersonScreen person={selected} analyses={currentAnalyses}
          onBack={() => setView("people")}
          onNewAnalysis={() => setView("analysis")}
          onOpenResult={(a) => { setOpenResult(a); setView("result"); }}
          onEdit={() => { setEditing(selected); setFormOpen(true); }}
          onDelete={handleDeletePerson} />
      )}
      {view === "analysis" && selected && (
        <AnalysisScreen person={selected} previousMean={lastMean}
          onBack={() => setView("person")} onSaved={handleSavedAnalysis} />
      )}
      {view === "result" && openResult && (
        <ResultScreen analysis={openResult} onBack={() => setView("person")} />
      )}
      {formOpen && (
        <PersonForm initial={editing} onSave={handleSavePerson}
          onClose={() => { setFormOpen(false); setEditing(null); }} />
      )}
    </div>
  );
}

document.getElementById("boot").remove();
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
