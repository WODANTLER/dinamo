<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anzoátegui — Producción audiovisual</title>
<meta name="description" content="Producción audiovisual.">
<meta name="theme-color" content="#0E0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..500&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0E0D0C;
  --caliza:#D2CDC5;
  --travertino:#8D857D;
  --linea:rgba(210,205,197,.30);
  --oro:#CDB891;
  --oro-luz:#F2E2BC;
  --f-display:'Archivo',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,monospace;
  --pad:clamp(18px,3.6vw,46px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--tinta);color:var(--caliza);overflow-x:clip;
  font-family:var(--f-mono);font-weight:300}
img,video{display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--caliza);outline-offset:5px}
.mono{font-family:var(--f-mono);font-size:clamp(9px,.92vw,10.5px);
  letter-spacing:.24em;text-transform:uppercase;color:var(--caliza);opacity:.72}

/* ═══ PRELOADER ═══ */
#pre{position:fixed;inset:0;z-index:300;background:var(--tinta);
  display:grid;place-items:center;transition:opacity .8s var(--ease),visibility .8s}
#pre.done{opacity:0;visibility:hidden;pointer-events:none}
#pre .bar{width:min(150px,34vw);height:1px;background:rgba(210,205,197,.14);
  position:relative;overflow:hidden}
#pre .bar i{position:absolute;inset:0 100% 0 0;background:var(--caliza);
  transition:right .95s var(--ease)}

/* ═══ HERO ═══ */
.hero{position:relative;overflow:hidden;background:var(--tinta);
  height:100vh;height:100svh;height:100lvh;min-height:480px}
.reel{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 46%;
  filter:saturate(1.16) contrast(1.045) brightness(1.035);
  opacity:0;transition:opacity 1.3s var(--ease),object-position 1.8s var(--ease);
}
.reel.on{opacity:1}
.hero__veil{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(to bottom,rgba(14,13,12,.30) 0%,rgba(14,13,12,0) 12%)}

/* zonas de cambio de reel */
.zone{position:absolute;top:0;bottom:24%;width:30%;z-index:8;cursor:pointer;
  background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.zone.l{left:0}.zone.r{right:0}
.zone i{position:absolute;top:50%;margin-top:-21px;
  width:42px;height:42px;border:1px solid var(--linea);border-radius:50%;
  background:radial-gradient(circle,rgba(14,13,12,.5) 40%,rgba(14,13,12,.18) 100%);
  display:grid;place-items:center;opacity:.55;
  transition:opacity .45s var(--ease),transform .45s var(--ease),border-color .45s}
.zone.l i{left:var(--pad)}
.zone.r i{right:var(--pad)}
.zone:hover i,.zone:focus-visible i{opacity:1;border-color:var(--caliza)}
.zone.l:hover i{transform:translateX(-4px)}
.zone.r:hover i{transform:translateX(4px)}
.zone .chev{width:13px;height:13px;stroke:var(--caliza);stroke-width:1.2;
  fill:none;stroke-linecap:square;transition:stroke .5s}
.zone .halo{position:absolute;left:50%;top:50%;width:112px;height:112px;
  margin:-56px 0 0 -56px;pointer-events:none;overflow:visible}
.zone .halo circle{fill:none;stroke-dasharray:132;stroke-dashoffset:132;opacity:0;
  transform:rotate(-90deg);transform-origin:50% 50%}
.zone .halo .aura{stroke:var(--oro);stroke-width:5}
.zone .halo .core{stroke:#E4D5B2;stroke-width:1.5}
body.intro .zone .halo .aura{animation:trace 1.15s cubic-bezier(.45,0,.15,1) .15s both;opacity:.16}

/* ── intro: la luz recorre los anillos y se convierte en texto ── */

body.intro .zone i{animation:respira 4.4s var(--ease) .05s both}
@keyframes respira{
  0%{transform:scale(1);border-color:var(--linea);opacity:.55;box-shadow:none}
  9%{transform:scale(1.14);border-color:rgba(228,213,178,.6);opacity:1;
     box-shadow:0 0 16px rgba(205,184,145,.26)}
  22%{transform:scale(1);border-color:rgba(228,213,178,.38);opacity:.95;
      box-shadow:0 0 12px rgba(205,184,145,.16)}
  86%{transform:scale(1);border-color:rgba(228,213,178,.38);opacity:.95;
      box-shadow:0 0 12px rgba(205,184,145,.16)}
  100%{transform:scale(1);border-color:var(--linea);opacity:.55;box-shadow:none}
}
body.intro .zone .halo .core{animation:trace 1.15s cubic-bezier(.45,0,.15,1) .15s both}
body.intro .zone .chev{animation:chev 1s ease .55s both}
@keyframes trace{
  0%{stroke-dashoffset:132;opacity:0}
  14%{opacity:1}
  72%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:0}
}
@keyframes chev{
  0%,100%{stroke:var(--caliza)}
  45%{stroke:#E4D5B2;stroke-width:1.5}
}

.introveil{position:absolute;inset:0;z-index:3;background:#0B0A09;
  opacity:0;pointer-events:none}
body.intro .introveil{animation:oscurecer 4.4s linear both}
@keyframes oscurecer{
  0%{opacity:0}
  8%{opacity:.30}
  26%{opacity:.285}
  44%{opacity:.245}
  60%{opacity:.195}
  74%{opacity:.140}
  87%{opacity:.075}
  100%{opacity:0}
}

.hint{position:absolute;top:38%;z-index:7;
  left:calc(var(--pad) + 62px);right:calc(var(--pad) + 62px);
  display:grid;place-items:center;pointer-events:none;
  transition:opacity .55s var(--ease)}
.hint .link{position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(to right,
    rgba(205,184,145,0) 0%, rgba(205,184,145,.36) 10%,
    rgba(205,184,145,.36) 90%, rgba(205,184,145,0) 100%);
  transform:scaleX(0);opacity:0}
body.intro .hint .link{animation:linkin 4.4s var(--ease) .5s both}
@keyframes linkin{
  0%{transform:scaleX(0);opacity:0}
  22%{transform:scaleX(1);opacity:1}
  86%{transform:scaleX(1);opacity:1}
  100%{transform:scaleX(1);opacity:0}
}
@media (max-width:760px){
  .hint{left:0;right:0}
  .hint .link{display:none}
}
.hint.out{opacity:0}
.hint .spark{display:block;width:0;height:1px;background:var(--oro);opacity:0;
  background:var(--oro);
  box-shadow:0 0 12px 1px rgba(205,184,145,.45)}
.hint .txt{position:absolute;white-space:nowrap;padding:0 22px;

  font-family:var(--f-mono);font-size:clamp(14px,1.62vw,21px);
  letter-spacing:.46em;text-transform:uppercase;color:#E6D6B4;
  opacity:0;
  text-shadow:0 0 16px rgba(205,184,145,.45),
              0 0 34px rgba(11,10,9,.7),
              0 1px 4px rgba(11,10,9,.55)}
body.intro .hint .spark{animation:spark 1.05s var(--ease) .95s both}
body.intro .hint .txt{animation:txtin .8s var(--ease) 1.45s both}
@keyframes spark{
  0%{width:0;opacity:0}
  22%{opacity:1}
  62%{width:300px;opacity:1}
  100%{width:380px;opacity:0}
}
@keyframes txtin{
  0%{opacity:0;filter:blur(12px);letter-spacing:.86em}
  60%{opacity:1}
  100%{opacity:1;filter:blur(0);letter-spacing:.46em}
}
@media (max-width:760px){
  .zone i{width:54px;height:54px;margin-top:-27px;opacity:.8}
  .zone .chev{width:17px;height:17px}
}

/* sonido */
.sound{position:absolute;top:var(--pad);right:var(--pad);z-index:6;
  width:38px;height:38px;border:1px solid var(--linea);border-radius:50%;
  background:rgba(14,13,12,.40);backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:var(--caliza);
  transition:border-color .5s,background .5s}
.sound:hover{border-color:var(--caliza);background:rgba(14,13,12,.45)}
.eq{display:flex;align-items:center;gap:2px;height:12px}
.eq i{width:1.5px;height:3px;background:currentColor;transition:height .35s}
.sound[data-on="true"] .eq i{animation:eq 1s ease-in-out infinite}
.sound[data-on="true"] .eq i:nth-child(2){animation-delay:.14s}
.sound[data-on="true"] .eq i:nth-child(3){animation-delay:.28s}
.sound[data-on="true"] .eq i:nth-child(4){animation-delay:.42s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* ── la frase: se forma con el scroll sobre el techo de lamas ── */
.dim{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
  will-change:opacity;background:#0B0A09}
.dim::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 78% 58% at 50% 38%,
    rgba(11,10,9,0) 0%,rgba(11,10,9,.30) 62%,rgba(11,10,9,.62) 100%)}
.quote{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;
  display:grid;place-items:center;pointer-events:none;
  padding:var(--pad) clamp(20px,4vw,80px) var(--lockH,420px)}
.quote__in{position:relative}
.quote__t{position:relative;z-index:2;margin:0;text-align:center;
  font-family:var(--f-display);font-variation-settings:'wdth' 108,'wght' 200;
  font-size:clamp(13px,1.72vw,30px);line-height:1.55;letter-spacing:.022em;
  color:#F3EDDF}
.quote__t .ln{display:block}
.quote__t .ln1{margin-bottom:.18em}
.quote__t .w{display:inline-block;opacity:0;will-change:opacity,filter,transform;
  text-shadow:0 0 12px rgba(243,237,223,.28),
              0 0 30px rgba(11,10,9,.85),
              0 1px 4px rgba(11,10,9,.6)}

/* lamas de luz: el eco del techo, abriéndose desde el centro */
.rays{position:absolute;left:-16%;right:-16%;top:50%;transform:translateY(-50%);
  height:clamp(130px,21vh,240px);pointer-events:none;z-index:1}
.rays i{position:absolute;left:0;right:0;height:1px;transform-origin:50% 50%;
  background:linear-gradient(to right,
    rgba(205,184,145,0) 0%,rgba(240,225,190,.8) 20%,
    rgba(240,225,190,.8) 80%,rgba(205,184,145,0) 100%);
  box-shadow:0 0 10px rgba(205,184,145,.3);
  transform:scaleX(0);opacity:0;will-change:transform,opacity}
.rays i:nth-child(1){top:0}      .rays i:nth-child(2){top:14%}
.rays i:nth-child(3){top:28%}    .rays i:nth-child(4){top:43%}
.rays i:nth-child(5){top:57%}    .rays i:nth-child(6){top:72%}
.rays i:nth-child(7){top:86%}    .rays i:nth-child(8){top:100%}

/* ── lockup: el apellido y el rótulo viajan juntos, pegados abajo ── */
.stage{position:relative}
.lock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;
  padding-top:clamp(70px,15vh,190px);will-change:transform;
  background:linear-gradient(to bottom,
    rgba(14,13,12,0) 0%,    rgba(14,13,12,.08) 10%, rgba(14,13,12,.26) 20%,
    rgba(14,13,12,.50) 30%, rgba(14,13,12,.66) 40%, rgba(14,13,12,.76) 52%,
    rgba(14,13,12,.83) 66%, rgba(14,13,12,.88) 82%, rgba(14,13,12,.92) 100%)}

.namewrap{padding:0 var(--pad) calc(var(--pad) * .85 + env(safe-area-inset-bottom,0px))}
.surname{display:block;width:100%;white-space:nowrap;
  font-family:var(--f-display);font-variation-settings:'wdth' 125,'wght' 200;
  font-size:12vw;line-height:.84;letter-spacing:-.004em;
  text-transform:uppercase;color:var(--caliza);
  text-shadow:0 2px 38px rgba(14,13,12,.32);
  visibility:hidden}
.surname .t{display:inline-block;white-space:nowrap}
.surname.fit{visibility:visible}
.rule{height:1px;background:var(--linea);margin-top:clamp(13px,1.9vw,20px)}
.foot{display:flex;justify-content:space-between;align-items:center;
  gap:16px;padding-top:11px}
.dots{display:flex;gap:8px;pointer-events:auto}
.dots button{display:block;width:26px;height:14px;border:0;background:none;
  padding:6px 0;cursor:pointer}
.dots button::before{content:'';display:block;width:100%;height:1px;
  background:var(--caliza);opacity:.3;transition:opacity .5s}
.dots button.on::before{opacity:1}

/* ═══ FRAMES ═══ */
.frame{position:relative;height:270vh;background:var(--tinta)}
.frame__pin{position:sticky;top:0;overflow:hidden;
  height:100vh;height:100svh;height:100lvh}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% var(--p,0%);will-change:object-position,filter,transform;
  filter:blur(var(--bl,0px));transform:scale(var(--sc,1));
  opacity:0;transition:opacity 1.1s var(--ease)}
.shot.on{opacity:1}

/* ── rótulo: entra al deslizar y se acopla sobre el apellido ── */
.band{padding:0 var(--pad) clamp(20px,3.1vh,36px);
  display:flex;align-items:baseline;justify-content:space-between;
  gap:clamp(16px,3vw,40px);flex-wrap:wrap;
  opacity:0;will-change:opacity,transform}
.band > *{pointer-events:auto}
.band__tag{
  font-family:var(--f-display);font-variation-settings:'wdth' 116,'wght' 200;
  font-size:clamp(12.5px,1.95vw,29px);line-height:1;letter-spacing:.21em;
  text-transform:uppercase;color:var(--caliza)}
.band__more{
  position:relative;background:none;border:0;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:9px;color:var(--travertino);
  font-family:var(--f-mono);font-weight:300;
  font-size:clamp(10px,1.05vw,12.5px);letter-spacing:.26em;text-transform:uppercase;
  transition:color .55s var(--ease);white-space:nowrap}
.band__more:hover{color:var(--caliza)}
.band__more::after{content:'';position:absolute;left:0;right:100%;bottom:-10px;
  height:1px;background:var(--caliza);transition:right .65s var(--ease)}
.band__more:hover::after{right:0}
.band__more svg{width:10px;height:10px;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linecap:square;transition:transform .55s var(--ease)}
.band__more:hover svg{transform:translateX(4px)}
@media (max-width:560px){
  .band{flex-direction:column;align-items:flex-start;gap:14px;
        padding:0 var(--pad) clamp(14px,2vh,20px)}
  .band__tag{font-size:13px;letter-spacing:.2em}
  .band__more::after{bottom:-7px}
}

/* ═══ CIERRE ═══ */
.end{padding:clamp(80px,17vh,190px) var(--pad) calc(var(--pad) * 1.5);
  max-width:1500px;margin:0 auto}
.end a.big{display:inline-block;position:relative;
  font-family:var(--f-display);font-variation-settings:'wdth' 106,'wght' 200;
  font-size:clamp(22px,5vw,72px);line-height:1;letter-spacing:-.012em;color:var(--caliza)}
.end a.big::after{content:'';position:absolute;left:0;right:100%;bottom:-.15em;
  height:1px;background:var(--caliza);transition:right .8s var(--ease)}
.end a.big:hover::after{right:0}
.social{display:flex;gap:clamp(11px,1.3vw,16px);
  margin-top:clamp(38px,6.5vw,68px)}
.social a{
  width:clamp(40px,3.3vw,48px);height:clamp(40px,3.3vw,48px);
  border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(205,184,145,.26);
  color:rgba(205,184,145,.72);
  transition:border-color .55s var(--ease),color .55s var(--ease),
             background-color .55s var(--ease),transform .55s var(--ease)}
.social a:hover{border-color:rgba(205,184,145,.72);color:#E4D5B2;
  background-color:rgba(205,184,145,.06);transform:translateY(-3px)}
.social svg{width:42%;height:42%;fill:currentColor}

.endrow{margin-top:clamp(40px,7vw,74px);padding-top:18px;border-top:1px solid var(--linea);
  display:flex;justify-content:space-between;gap:16px}

/* ── móvil: la foto se recorre de verdad y el tramo es más corto ── */
@media (max-width:760px){
  .frame{height:196vh}
  .shot{inset:0 0 auto 0;height:132%;object-position:50% 50%;
    transform:translateY(calc(var(--pn,0) * -24.2%)) scale(var(--sc,1))}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="pre"><div class="bar"><i></i></div></div>

<div class="stage">
<header class="hero">
  <video class="reel on" data-reel src="video/reel-01.mp4" poster="video/poster-01.jpg"
         muted loop playsinline preload="auto"></video>
  <video class="reel" data-reel src="video/reel-02.mp4" poster="video/poster-02.jpg"
         muted loop playsinline preload="auto"></video>

  <div class="hero__veil"></div>
  <div class="introveil" id="introveil" aria-hidden="true"></div>

  <button class="zone l" id="zl" aria-label="Reel anterior">
    <i>
      <svg class="halo" viewBox="0 0 112 112" aria-hidden="true">
        <circle class="aura" cx="56" cy="56" r="21"/><circle class="core" cx="56" cy="56" r="21"/>
      </svg>
      <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 1.5 2.5 6l5 4.5"/></svg>
    </i>
  </button>
  <button class="zone r" id="zr" aria-label="Reel siguiente">
    <i>
      <svg class="halo" viewBox="0 0 112 112" aria-hidden="true">
        <circle class="aura" cx="56" cy="56" r="21"/><circle class="core" cx="56" cy="56" r="21"/>
      </svg>
      <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 1.5 9.5 6l-5 4.5"/></svg>
    </i>
  </button>

  <div class="hint" id="hint" aria-hidden="true">
    <span class="link"></span>
    <span class="spark"></span>
    <span class="txt">slide for more</span>
  </div>

  <button class="sound" id="snd" data-on="false" aria-label="Activar sonido">
    <span class="eq"><i></i><i></i><i></i><i></i></span>
  </button>

</header>

<div class="lock">
  <div class="band">
    <span class="band__tag">Premium content creator</span>
    <button class="band__more" type="button">
      <span>Ver más</span>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 1.5 9.5 6l-5 4.5"/></svg>
    </button>
  </div>
  <div class="namewrap">
    <span class="surname"><span class="t">Anzoátegui</span></span>
    <div class="rule"></div>
    <div class="foot">
      <span class="mono">Producción audiovisual</span>
      <span class="dots" id="dots">
        <button class="on" aria-label="Reel 1"></button>
        <button aria-label="Reel 2"></button>
      </span>
    </div>
  </div>
</div>

<section class="frame" data-frame>
  <div class="frame__pin">
    <img class="shot on" data-shot src="img/frame-01.jpg" alt="">
    <picture>
      <source media="(max-width:760px)" srcset="img/frame-02m.jpg">
      <img class="shot" data-shot src="img/frame-02.jpg" alt="">
    </picture>
  </div>
</section>
</div>


<div class="dim" id="dim" aria-hidden="true"></div>
<div class="quote" id="quote" aria-hidden="true">
  <div class="quote__in">
  <div class="rays"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="quote__t">
    <span class="ln ln1"><span class="w">We</span> <span class="w">aim</span> <span class="w">for</span> <span class="w">perfection.</span> </span>
    <span class="ln ln2"><span class="w">Redefining</span> <span class="w">the</span> <span class="w">visual</span> <span class="w">presence</span> <span class="w">of</span> <span class="w">the</span> <span class="w">brands</span> <span class="w">that</span> <span class="w">rule</span> <span class="w">the</span> <span class="w">world</span> </span>
  </p>
  </div>
</div>

<footer class="end">

<script>
(function(){
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reels=[...document.querySelectorAll('[data-reel]')];
  const dots=[...document.getElementById('dots').querySelectorAll('button')];
  const shots=[...document.querySelectorAll('[data-shot]')];
  const lock=document.querySelector('.lock');
  const band=document.querySelector('.band');
  const stage=document.querySelector('.stage');
  const dim=document.getElementById('dim');
  const quote=document.getElementById('quote');
  const rays=[...quote.querySelectorAll('.rays i')];
  const words=[...quote.querySelectorAll('.w')];
  const medio=(words.length-1)/2;
  /* orden caleidoscópico: cada palabra entra según su distancia al centro */
  const orden=words.map((w,i)=>Math.abs(i-medio)/medio);
  const lado=words.map((w,i)=>i<medio?-1:(i>medio?1:0));
  const clamp=(v)=>v<0?0:(v>1?1:v);
  let fPrev=-1;

  function frase(f){
    if(Math.abs(f-fPrev)<0.003 && f!==0 && f!==1) return;
    fPrev=f;
    /* lamas de luz: se abren desde el centro y se apagan al formarse el texto */
    rays.forEach((r,i)=>{
      const d=Math.abs(i-(rays.length-1)/2)/((rays.length-1)/2);
      const rp=clamp((f-0.02-d*0.14)/0.28);
      const off=clamp((f-0.40)/0.32);
      r.style.transform='scaleX('+(rp*(1-d*0.30)).toFixed(3)+')';
      r.style.opacity=(rp*(1-off)).toFixed(3);
    });
    /* palabras: del centro hacia los bordes */
    for(let i=0;i<words.length;i++){
      const lp=clamp((f-0.10-orden[i]*0.52)/0.34);
      const w=words[i];
      w.style.opacity=lp.toFixed(3);
      w.style.filter='blur('+((1-lp)*9).toFixed(1)+'px)';
      w.style.transform='translateY('+(lado[i]*(1-lp)*7).toFixed(1)+'px)';
    }
  }

  function ambiente(){
    const f=frames[0]; if(!f) return;
    const r=f.getBoundingClientRect(), span=r.height-innerHeight;
    let p=span>0?clamp((-r.top)/span):0;
    if(r.top>innerHeight||r.bottom<0) p=0;
    /* la entrada se mide desde que la foto asoma por abajo, no desde que se ancla:
       así la frase ya está armada cuando la foto llega arriba */
    const e=(innerHeight-r.top)/innerHeight;
    const movil=innerWidth<=760;
    /* en móvil todo se mide sobre el mismo recorrido continuo: la frase
       queda armada antes de que la foto llegue arriba y despeja enseguida */
    const dentro=movil ? clamp((e-0.08)/0.50) : clamp((e-0.16)/0.72);
    const fuera =movil ? clamp((e-0.88)/0.26) : clamp((p-0.24)/0.16);
    const vis=dentro*(1-fuera);
    frase(dentro);
    quote.style.opacity=vis.toFixed(3);
    dim.style.opacity=(vis*(movil?0.70:0.56)).toFixed(3);
    const bl=(vis*6).toFixed(1);
    document.querySelectorAll('.shot').forEach(im=>{
      im.style.setProperty('--bl',bl+'px');
      im.style.setProperty('--sc',(1+vis*0.022).toFixed(4));
    });
  }
  /* el lockup vive pegado abajo y se retira junto con el escenario */
  function anclaje(){
    const bt=band.getBoundingClientRect().top;
    document.documentElement.style.setProperty('--lockH',Math.max(0,Math.round(innerHeight-bt))+'px');
    const sb=stage.getBoundingClientRect().bottom;
    const off=Math.min(0,sb-innerHeight);
    lock.style.transform='translateY('+off.toFixed(1)+'px)';
    lock.style.visibility = sb<=0 ? 'hidden' : 'visible';
  }
  const name=document.querySelector('.surname');

  /* el apellido se ajusta al ancho exacto del contenedor */
  const nameT=name.querySelector('.t');
  function fitName(){
    name.style.fontSize='100px';
    const avail=name.clientWidth;
    const needed=nameT.getBoundingClientRect().width;
    if(!needed||!avail) return;
    name.style.fontSize=(100*avail/needed).toFixed(2)+'px';
    name.classList.add('fit');
  }
  function ajustar(){ fitName(); anclaje(); }
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(ajustar); }
  ajustar();
  addEventListener('resize',ajustar);
  setTimeout(ajustar,1200);
  let cur=0,soundOn=false;

  /* preloader */
  const pre=document.getElementById('pre'),bar=pre.querySelector('.bar i');
  requestAnimationFrame(()=>bar.style.right='0%');
  let lifted=false;
  const lift=()=>{ if(lifted)return; lifted=true;
    setTimeout(()=>{ pre.classList.add('done'); startIntro(); },320); };
  reels[0].addEventListener('loadeddata',lift,{once:true});
  setTimeout(lift,2000);

  /* cambio de reel */
  function go(n){
    n=(n+reels.length)%reels.length;
    if(n===cur)return;
    const prev=reels[cur],next=reels[n];
    /* el cambio visual va primero y nunca depende de que el video esté listo */
    next.classList.add('on'); prev.classList.remove('on');
    cur=n; dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    shots.forEach((im,i)=>im.classList.toggle('on',i===cur));
    next.muted=!soundOn; prev.muted=true;
    try{ next.currentTime=0; }catch(e){}
    const pr=next.play(); if(pr&&pr.catch) pr.catch(()=>{});
    setTimeout(()=>{ if(!prev.classList.contains('on')){ try{prev.pause();}catch(e){} } },1400);
  }
  document.getElementById('zl').addEventListener('click',()=>go(cur-1));
  document.getElementById('zr').addEventListener('click',()=>go(cur+1));
  dots.forEach((d,i)=>d.addEventListener('click',()=>go(i)));
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')go(cur-1);
    if(e.key==='ArrowRight')go(cur+1);
  });

  /* ── intro: la lagartija espera quieta mientras corre la luz ── */
  const hint=document.getElementById('hint');
  let introTimers=[], introDone=false;

  function playCurrent(){
    const pr=reels[cur].play();
    if(pr&&pr.catch) pr.catch(()=>{});
  }
  function endIntro(){
    if(introDone) return; introDone=true;
    introTimers.forEach(clearTimeout);
    hint.classList.add('out');
    document.body.classList.remove('intro');
    setTimeout(()=>{ hint.remove(); },600);
    playCurrent();
  }
  function startIntro(){
    if(rm){ endIntro(); return; }
    document.body.classList.add('intro');
    /* el video arranca mientras el texto sigue puesto: la lagartija pestañea de fondo */
    introTimers.push(setTimeout(playCurrent,1500));
    introTimers.push(setTimeout(()=>hint.classList.add('out'),3900));
    introTimers.push(setTimeout(endIntro,4400));
  }
  /* cualquier gesto del visitante corta la intro y arranca el video */
  ['pointerdown','wheel','touchstart','keydown'].forEach(ev=>
    addEventListener(ev,endIntro,{once:true,passive:true}));

  /* encuadre: en la apertura la lagartija queda justo encima del apellido,
     y al terminar ese plano el encuadre sube al resto del reel */
  const APERTURA='50% 63%', RESTO='50% 47%', CORTE=3.1;
  const v0=reels[0];
  v0.style.objectPosition=APERTURA;
  v0.addEventListener('timeupdate',()=>{
    const q = v0.currentTime < CORTE ? APERTURA : RESTO;
    if(v0.style.objectPosition!==q) v0.style.objectPosition=q;
  });
  v0.addEventListener('seeked',()=>{ if(v0.currentTime<0.3) v0.style.objectPosition=APERTURA; });

  /* sonido */
  const btn=document.getElementById('snd');
  btn.addEventListener('click',()=>{
    soundOn=!soundOn;
    reels.forEach((v,i)=>{ v.muted = !(soundOn && i===cur); });
    if(soundOn){ reels[cur].volume=.6; reels[cur].play().catch(()=>{}); }
    btn.dataset.on=String(soundOn);
    btn.setAttribute('aria-label',soundOn?'Silenciar':'Activar sonido');
  });

  /* recorrido de las fotos */
  const frames=[...document.querySelectorAll('[data-frame]')];
  let t=false;
  function acople(){
    const p=Math.min(1,Math.max(0,scrollY/(innerHeight*0.40)));
    band.style.opacity=p.toFixed(3);
    band.style.transform='translateY('+((1-p)*28).toFixed(1)+'px)';
  }
  function pan(){
    acople(); anclaje(); ambiente();
    for(const f of frames){
      const r=f.getBoundingClientRect(),span=r.height-innerHeight;
      if(span<=0||r.bottom<0||r.top>innerHeight)continue;
      const p=Math.min(1,Math.max(0,(-r.top)/span));
      f.querySelectorAll('.shot').forEach(im=>{
        im.style.setProperty('--p',(p*100).toFixed(2)+'%');
        im.style.setProperty('--pn',p.toFixed(4));
      });
    }
    t=false;
  }
  if(!rm){
    addEventListener('scroll',()=>{if(!t){t=true;requestAnimationFrame(pan);}},{passive:true});
    addEventListener('resize',pan); pan();
  } else { acople(); anclaje(); ambiente(); addEventListener('scroll',()=>{acople();anclaje();ambiente();},{passive:true}); }
})();
</script>
